[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "social-publisher"
version         = "0.1.0"
description     = "Post text, images and videos to YouTube, X and LinkedIn from one command, with the tokens kept in a .env file."
requires-python = ">=3.11"
dependencies    = [
    "requests>=2.31",
    "requests-oauthlib>=1.3",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
social-publish     = "social_publisher.cli:main"
social-publisher-mcp = "social_publisher.mcp_server:main"

[tool.setuptools.packages.find]
include = ["social_publisher*"]
